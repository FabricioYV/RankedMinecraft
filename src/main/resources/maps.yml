# Configuración de pools de mapas para RankedMinecraft
pools:
  5v5:
    - "Warlock"
    - "Senex"
    - "BlockRAGE"
    - "Antiquis"
    - "Avalon"
    - "Battle of Tenjin"
    - "Cargo"
    - "Desert Sanctuary"
    - "Frozen Myst"
    - "Justice"

  8v8:
    - "Battle of Lyndanisse"
    - "Bamboo Valley"
    - "Deepwind Jungle"
    - "Fractal Descent"
    - "Golden Drought III"
    - "Harb"
    - "Icebound"
    - "King of the Ladder"
    - "Medieval Warfare"
    - "Race for Victory 3"

# Configuración adicional
voting:
  duration: 20 # segundos para votar
  enable_player_voting: true # true = jugadores votan, false = selección aleatoria automática

map_cycle:
  delay: 6 # segundos de espera después del ciclo

final_countdown:
  duration: 10 # segundos de cuenta regresiva final
